# configuracion para Render (Blueprint). Los valores secretos se llenan en el panel.
services:
  - type: web
    name: tampu
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: TAMPU
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_LOCALE
        value: es
      - key: APP_TIMEZONE
        value: America/Lima
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: ARCHIVOS
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_REGION
        sync: false
      - key: SUPABASE_S3_KEY
        sync: false
      - key: SUPABASE_S3_SECRET
        sync: false
      - key: SUPABASE_BUCKET_FOTOS
        value: fotos
      - key: SUPABASE_BUCKET_DOCUMENTOS
        value: documentos
      - key: CONTACTO_CORREO
        sync: false
      - key: INSTITUCION_DOMINIO
        value: continental.edu.pe
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
